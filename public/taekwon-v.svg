<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="태권브이 스타일 로봇 아바타">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#aab4c2"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f05252"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fff7ed" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff7ed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <rect width="200" height="200" fill="url(#glow)"/>

  <g stroke="#1e293b" stroke-linejoin="round" stroke-linecap="round">
    <!-- 어깨 패드 -->
    <path d="M42 200c-5-24 1-38 15-42 11-3 17 4 17 15v27z" fill="url(#red)" stroke-width="4"/>
    <path d="M158 200c5-24-1-38-15-42-11-3-17 4-17 15v27z" fill="url(#red)" stroke-width="4"/>

    <!-- 목 -->
    <rect x="87" y="134" width="26" height="20" rx="5" fill="url(#steel)" stroke-width="4"/>

    <!-- 몸통 -->
    <path d="M76 150h48c12 0 20 10 22 24l4 26H50l4-26c2-14 10-24 22-24z" fill="url(#blue)" stroke-width="4"/>
    <!-- 가슴 V 엠블럼 -->
    <path d="M100 198 84 166h11l5 12 5-12h11z" fill="url(#steel)" stroke-width="3"/>

    <!-- 사이드 이어 -->
    <rect x="38" y="86" width="18" height="32" rx="6" fill="url(#red)" stroke-width="4"/>
    <rect x="144" y="86" width="18" height="32" rx="6" fill="url(#red)" stroke-width="4"/>
    <circle cx="47" cy="102" r="5" fill="#fbbf24" stroke-width="3"/>
    <circle cx="153" cy="102" r="5" fill="#fbbf24" stroke-width="3"/>

    <!-- 머리 -->
    <rect x="52" y="46" width="96" height="94" rx="24" fill="url(#steel)" stroke-width="4"/>

    <!-- 눈 마스크 -->
    <rect x="62" y="76" width="76" height="34" rx="9" fill="#111827" stroke-width="4"/>
  </g>

  <!-- 눈 -->
  <path d="M70 84l24 6v12H70z" fill="#fde68a"/>
  <path d="M130 84l-24 6v12h24z" fill="#fde68a"/>
  <!-- 중앙 리지 -->
  <rect x="97" y="88" width="6" height="20" rx="2" fill="url(#steel)"/>

  <!-- 입 그릴 -->
  <g stroke="#1e293b" stroke-linejoin="round">
    <rect x="79" y="116" width="42" height="16" rx="4" fill="url(#steel)" stroke-width="4"/>
  </g>
  <g stroke="#475569" stroke-width="3">
    <line x1="89" y1="118" x2="89" y2="130"/>
    <line x1="100" y1="118" x2="100" y2="130"/>
    <line x1="111" y1="118" x2="111" y2="130"/>
  </g>

  <!-- V자 뿔 -->
  <path d="M60 18 100 70 140 18" fill="none" stroke="#7f1d1d" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 18 100 70 140 18" fill="none" stroke="url(#red)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 이마 젬 -->
  <circle cx="100" cy="65" r="9" fill="#fbbf24" stroke="#7f1d1d" stroke-width="4"/>
</svg>
